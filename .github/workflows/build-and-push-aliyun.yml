name: Build and Push to Aliyun

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version number
        id: version
        run: |
          # 获取最新的 tag，如果没有则从 v1.0.0 开始
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # 提取版本号并递增
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_number=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Pull and push MySQL
        run: |
          docker pull mysql:8.0
          docker tag mysql:8.0 registry.cn-hangzhou.aliyuncs.com/yvan329/mysql:8.0
          docker push registry.cn-hangzhou.aliyuncs.com/yvan329/mysql:8.0

      - name: Pull and push Redis
        run: |
          docker pull redis:7-alpine
          docker tag redis:7-alpine registry.cn-hangzhou.aliyuncs.com/yvan329/redis:7-alpine
          docker push registry.cn-hangzhou.aliyuncs.com/yvan329/redis:7-alpine

      - name: Pull and push MinIO
        run: |
          docker pull minio/minio:RELEASE.2025-02-28T09-55-16Z
          docker tag minio/minio:RELEASE.2025-02-28T09-55-16Z registry.cn-hangzhou.aliyuncs.com/yvan329/minio:RELEASE.2025-02-28T09-55-16Z
          docker push registry.cn-hangzhou.aliyuncs.com/yvan329/minio:RELEASE.2025-02-28T09-55-16Z

      - name: Build and push waoowaoo app
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/yvan329/waoowaoo:${{ steps.version.outputs.version }}
            registry.cn-hangzhou.aliyuncs.com/yvan329/waoowaoo:${{ steps.version.outputs.version_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
